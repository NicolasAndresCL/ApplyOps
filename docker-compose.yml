# Entorno local: UI (NiceGUI) + API + PostgreSQL 16.
#   docker compose up -d --build --wait   # levanta y espera los healthchecks
#   docker compose down                   # baja; conserva los datos
#   docker compose down -v                # baja y BORRA la base de datos
name: applyops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: applyops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: applyops
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 en el host para no chocar con un PostgreSQL local en 5432.
      - "127.0.0.1:${DB_PUERTO_HOST:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyops -d applyops"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://applyops:${POSTGRES_PASSWORD}@db:5432/applyops
      PERFIL_BUSQUEDA_PATH: ${PERFIL_BUSQUEDA_PATH:-perfil/busqueda.yaml}
      RECOLECCION_INTERVALO_HORAS: ${RECOLECCION_INTERVALO_HORAS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # El perfil real no entra en la imagen: se monta de solo lectura.
      - ./perfil:/app/perfil:ro
    ports:
      - "127.0.0.1:${API_PUERTO_HOST:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  ui:
    # Misma imagen que la API; otro proceso. Habla con la API por HTTP en la red interna.
    build: .
    entrypoint: ["python", "-m", "applyops.adapters.inbound.ui.main"]
    environment:
      API_URL: http://api:8000
      UI_HOST: 0.0.0.0
      UI_PUERTO: 8080
      # Fijo en .env para que el tema elegido sobreviva a un reinicio; si falta, se genera uno.
      UI_STORAGE_SECRET: ${UI_STORAGE_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Imágenes de los temas (con derechos de autor, no van en la imagen ni en git).
      # Sin la carpeta, los temas se ven con sus colores.
      - ./assets/temas:/app/assets/temas:ro
    ports:
      - "127.0.0.1:${UI_PUERTO_HOST:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
